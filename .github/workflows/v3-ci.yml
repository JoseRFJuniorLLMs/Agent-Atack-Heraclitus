name: Agent-Atack V3 CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m compileall -q .
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Guard invariant
        run: |
          ! grep -R --line-number --include='*.py' --exclude-dir=.git -- '--allow-remote' .
          ! grep -R --line-number --include='*.py' -- 'shell=True' .
